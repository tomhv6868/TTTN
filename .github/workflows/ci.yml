name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config/reproducibility-requirements.txt
      - name: Install capture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpcap-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --requirement config/reproducibility-requirements.txt
          python -m pip install --no-deps --editable .
      - name: Configure core build
        run: >-
          cmake -S . -B "$RUNNER_TEMP/nids-build" -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DNIDS_BUILD_TOOLCHAIN_SMOKE=OFF
      - name: Build core
        run: cmake --build "$RUNNER_TEMP/nids-build" --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir "$RUNNER_TEMP/nids-build" --build-config Release --output-on-failure
      - name: Run Python tests
        run: python tools/run_ci_tests.py
